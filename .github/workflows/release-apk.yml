name: Release APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk              app/build/outputs/apk/release/homelab-amoled-monitor-release.apk

      - name: Verify APK signature
        run: |
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose             app/build/outputs/apk/release/homelab-amoled-monitor-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: homelab-amoled-monitor-release
          path: app/build/outputs/apk/release/homelab-amoled-monitor-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/homelab-amoled-monitor-release.apk
          generate_release_notes: true
